[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contentiq-engine"
version = "0.1.0"
description = "ContentIQ DSA engine: near-duplicate detection (MinHash + LSH) and hashtag intelligence"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["contentiq_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
